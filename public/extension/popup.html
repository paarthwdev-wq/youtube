<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VoiceTube Remote</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #27272a;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-online { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 6px 0;
      color: #a1a1aa;
    }
    .status-val {
      color: #fafafa;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }
    .btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🎙️</span>
    <strong style="font-size: 13px; flex: 1;">VoiceTube Control</strong>
    <span id="ytBadge" class="badge badge-offline">Offline</span>
  </div>
  <div class="status-row">
    <span>YouTube Tab:</span>
    <span id="tabStatus" class="status-val">Searching...</span>
  </div>
  <div class="status-row">
    <span>Player State:</span>
    <span id="playerState" class="status-val">-</span>
  </div>
  <div class="status-row">
    <span>Playback Speed:</span>
    <span id="playerSpeed" class="status-val">1.0x</span>
  </div>
  <button id="openAppBtn" class="btn">Open VoiceTube Control</button>
  <script src="popup.js"></script>
</body>
</html>
